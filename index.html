<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>国际站运营看板</title>
<link rel="stylesheet" href="styles.css?v=20261009-boss5">
</head>
<body>

<!-- 密码锁（明文部署时自动跳过） -->
<div id="lockOverlay" style="display:none;position:fixed;inset:0;background:#0b1f3a;z-index:9999;align-items:center;justify-content:center;font-family:-apple-system,'Segoe UI','Microsoft YaHei',sans-serif;">
  <div style="background:#fff;border-radius:14px;padding:36px 40px;width:340px;max-width:88vw;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.4);">
    <div style="font-size:42px;">🔒</div>
    <h2 style="margin:12px 0 6px;color:#0b1f3a;font-size:20px;">看板已加密</h2>
    <p style="color:#8a94a0;font-size:13px;margin:0 0 18px;">请输入访问密码</p>
    <input id="lockPass" type="password" placeholder="访问密码" autocomplete="off" style="width:100%;box-sizing:border-box;padding:11px 14px;border:1px solid #d8dee6;border-radius:8px;font-size:15px;margin-bottom:14px;outline:none;">
    <button id="lockBtn" style="width:100%;padding:11px;background:#1668dc;color:#fff;border:none;border-radius:8px;font-size:15px;cursor:pointer;">解锁看板</button>
    <div id="lockErr" style="color:#d4380d;font-size:13px;margin-top:12px;display:none;">密码错误，请重试</div>
  </div>
</div>

<!-- 顶部深蓝 header -->
<div class="topbar">
  <span class="logo">国际站运营看板</span>
  <select class="store-sel" id="storeSel" onchange="try{localStorage.setItem('alibaba_store', this.value);}catch(e){} location.reload();">
    <option value="lifeworth">莱华仕·运动营养</option>
    <option value="yh">YH·草本补充剂</option>
    <option value="lifeworth03">1903</option>
    <option value="lifeworth1901">1901</option>
  </select>
  <div class="seg">
    <button id="segWeek" class="on">周</button>
    <button id="segMonth">月</button>
  </div>
  <select class="store-sel" id="weekSel"></select>
  <span class="date" id="dateLabel"></span>
  <div class="spacer"></div>
  <input id="globalSearch" class="global-search" placeholder="🔍 搜索板块/产品/指标..." autocomplete="off">
  <div class="search-drop" id="searchDrop"></div>
  <span class="user" id="userLabel">李嘉祥 (子账号)</span>
  <button class="btn">改密码</button>
  <button class="btn">退出</button>
</div>

<!-- 视角切换：运营 ↔ 老板 -->
<div class="viewswitch" id="viewSwitch">
  <button class="vs-btn on" data-view="boss">👔 老板看板</button>
  <button class="vs-btn" data-view="ops">📊 运营看板</button>
  <span class="vs-spacer"></span>
  <span class="vs-export">⬇ 导出CSV
    <select id="bossExportView" class="vs-select"><option value="boss">老板看板</option><option value="ops">运营看板</option></select>
    <button type="button" id="bossExportBtn" class="vs-export-btn">导出</button>
  </span>
</div>
<!-- 二级导航 -->
<div class="navbar" id="navbar">
  <div class="tab on" data-tab="period">周期看板</div>
  <div class="tab" data-tab="focus">⭐ 重点关注</div>
  <div class="tab" data-tab="ai">🔵 AI搜索</div>
  <div class="tab" data-tab="trend">趋势对比</div>
  <div class="tab" data-tab="exec">改造执行台</div>
  <div class="tab" data-tab="compete">竞品对比</div>
  <div class="tab" data-tab="peer">🏆 同行标杆</div>
  <div class="tab" data-tab="admin">管理</div>
</div>

<div class="wrap">
  <!-- ============ 周期看板 ============ -->
  <div class="tabpanel on" id="panel-period"></div>
  <!-- ============ 重点关注 ============ -->
  <div class="tabpanel" id="panel-focus"></div>
  <!-- ============ AI搜索 ============ -->
  <div class="tabpanel" id="panel-ai"></div>
  <!-- ============ 趋势对比 ============ -->
  <div class="tabpanel" id="panel-trend"></div>
  <!-- ============ 改造执行台 ============ -->
  <div class="tabpanel" id="panel-exec"></div>
  <!-- ============ 竞品对比 ============ -->
  <div class="tabpanel" id="panel-compete"></div>
  <!-- ============ 同行标杆 ============ -->
  <div class="tabpanel" id="panel-peer"></div>
  <!-- ============ 管理 ============ -->
  <div class="tabpanel" id="panel-admin"></div>
  <!-- ============ 老板看板 ============ -->
  <div class="tabpanel" id="panel-boss"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="dashboard_data.js?v=20261009-boss5"></script>
<script src="dashboard_data_yh.js"></script>
<script>
(function(){
  function b64ToBytes(b64){
    var bin = atob(b64), u = new Uint8Array(bin.length);
    for (var i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i);
    return u;
  }
  async function tryDecrypt(b64, pass){
    var kb = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(pass));
    var key = await crypto.subtle.importKey('raw', kb, {name:'AES-GCM'}, false, ['decrypt']);
    var buf = b64ToBytes(b64);
    var pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:buf.slice(0,12), tagLength:128}, key, buf.slice(12));
    return new TextDecoder().decode(pt);
  }
  function loadApp(){
    var s = document.createElement('script');
    s.src = 'app.js?v=20261009-boss5';
    s.onload = function(){ if (document.readyState !== 'loading' && typeof boot === 'function') boot(); };
    document.body.appendChild(s);
  }
  var STORES = window.V4_STORES || { lifeworth: window.V4_DATA_ENCRYPTED, yh: window.V4_DATA_ENCRYPTED_YH };
  var currentStore = (function(){ try{ return localStorage.getItem('alibaba_store') || 'lifeworth'; }catch(e){ return 'lifeworth'; } })();
  function getEnc(){ return STORES[currentStore] || null; }
  if (getEnc()){
    var ov = document.getElementById('lockOverlay');
    var btn = document.getElementById('lockBtn');
    var inp = document.getElementById('lockPass');
    var err = document.getElementById('lockErr');
    var ss = document.getElementById('storeSel');
    if (ss) ss.value = currentStore;
    ov.style.display = 'flex';
    async function unlock(){
      var pass = inp.value;
      try{
        var json = await tryDecrypt(getEnc(), pass);
        window.V4_DATA = JSON.parse(json);
        window.V4_STORE = currentStore;
        ov.style.display = 'none';
        loadApp();
      }catch(e){
        err.style.display = 'block';
      }
    }
    btn.onclick = unlock;
    inp.addEventListener('keydown', function(e){ if(e.key==='Enter') unlock(); });
    inp.focus();
  } else if (currentStore === 'yh') {
    var ov = document.getElementById('lockOverlay');
    var h2 = ov.querySelector('h2');
    var p = ov.querySelector('p');
    var inp = document.getElementById('lockPass');
    var btn = document.getElementById('lockBtn');
    var ss = document.getElementById('storeSel');
    if (ss) ss.value = 'yh';
    if (h2) h2.textContent = 'YH 数据尚未接入';
    if (p) p.textContent = 'YH·草本补充剂 店铺看板数据还未接入，请先切回「莱华仕·运动营养」。';
    if (inp) inp.style.display = 'none';
    if (btn) { btn.textContent = '切回莱华仕'; btn.onclick = function(){ try{ localStorage.setItem('alibaba_store','lifeworth'); }catch(e){} location.reload(); }; }
    ov.style.display = 'flex';
  } else {
    loadApp();
  }
})();
</script>
</body>
</html>
